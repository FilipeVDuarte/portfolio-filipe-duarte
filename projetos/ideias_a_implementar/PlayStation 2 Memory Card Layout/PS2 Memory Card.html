<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- support.js: runtime do framework "dc" (DCLogic, x-dc, sc-for, template bindings {{ }}) -->
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- ================= <helmet>: recursos carregados no <head> do componente ================= -->
<helmet>
  <!-- Fonte pixelada usada em toda a UI (definida no seletor global "*" logo abaixo) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    /* Para trocar a fonte, mude aqui e no <link> acima */
    * { font-family: 'Press Start 2P', 'Courier New', monospace; }
  </style>
  <!-- Biblioteca Three.js usada para renderizar os ícones 3D (esferas/icosaedros) no <canvas> -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</helmet>

<!-- ================= Container raiz: controla o fundo (muda entre tela de grade e tela de detalhe) ================= -->
<div style="position:fixed;inset:0;overflow:hidden;background:{{ bgStyle }};
            transition:background 0.15s linear;user-select:none;">

  <!-- Canvas 3D em tela cheia (camada z-index:1, atrás do texto).
       Aqui é onde o Three.js desenha os ícones; o resto da UI é feito com <div>s por cima.
       Se precisar mudar a posição/zoom dos ícones, mexa em setupThree()/tick() no <script> abaixo,
       não neste elemento. -->
  <canvas ref="{{ canvasRef }}" style="position:fixed;
              inset:0;pointer-events:none;z-index:1;"></canvas>

  <!-- ===== Cabeçalho (canto superior esquerdo): título da pasta + espaço livre em KB ===== -->
  <div style="position:absolute;z-index:2;top:28px;left:36px;color:#f2f2f2;">
    <div style="font-size:13px;line-height:1.6;letter-spacing:0.5px;color:#ffd400;
                text-shadow:2px 2px 0 rgba(0,0,0,0.5);">Projetos <span style="font-size:10px;color:#f2f2f2;">(PS2)/1</span></div>

    <!-- Valor vem de state.freeKB (renderVals() no JS). Editar lá, não aqui. -->
    <div style="font-size:10px;margin-top:8px;color:#e4e4e4;text-shadow:2px 2px 0 rgba(0,0,0,0.5);">{{ freeKB }} KB Free</div>
  </div>

  <!-- ===== Título do item selecionado (canto superior direito) =====
       Só aparece na tela de grade (titleDisplay some quando entra no detalhe).
       sc-for percorre selectedTitleLines (array de 2 linhas, ex: ["Projeto","Zero Um"]). -->
  <div style="position:absolute;z-index:2;top:28px;right:36px;text-align:right;color:#ffd400;
              font-size:13px;line-height:1.8;text-shadow:2px 2px 0 rgba(0,0,0,0.5);max-width:360px;display:{{ titleDisplay }};">
    <sc-for list="{{ selectedTitleLines }}" as="line" hint-placeholder-count="2">
      <div>{{ line }}</div>
    </sc-for>
  </div>

  <!-- ===== Grade de seleção (5 colunas x 3 linhas = 15 slots) =====
       Estas divs são apenas ÁREAS CLICÁVEIS INVISÍVEIS; os ícones visuais (3D) são
       desenhados no <canvas> acima, alinhados ao centro de cada célula (ver
       updateGridPositions() no JS, que lê getBoundingClientRect() destas células).
       Para mudar o número de colunas/linhas ou o tamanho das células, ajuste
       grid-template-columns/rows aqui E o valor "cols/total" em onKeyDown() no JS. -->
  <div ref="{{ gridRef }}" style="position:absolute;z-index:2;top:110px;left:50%;transform:translateX(-50%);display:grid;
                                  grid-template-columns:repeat(5, 118px);grid-template-rows:repeat(3, 110px);column-gap:34px;row-gap:8px;display:{{ gridDisplay }};">
    <sc-for list="{{ slots }}" as="slot" hint-placeholder-count="15">
      <!-- onSelect definido em renderVals() -> onSlotClick(i) -->
      <div onClick="{{ slot.onSelect }}" style="width:118px;height:130px;cursor:pointer;"></div>
    </sc-for>
  </div>

  <!-- ===== Painel de detalhe (aparece ao "entrar" em um item) =====
       Mostra nome, data, tamanho e as opções COPY/DELETE.
       Cor/fundo dos botões mudam conforme detailOption (0 = COPY, 1 = DELETE),
       controlado em onKeyDown() (setas cima/baixo) e nos onClick abaixo. -->
  <div style="position:absolute;z-index:2;top:32%;right:9%;width:32%;color:#f4f4f4;display:{{ detailDisplay }};">
    <div style="font-size:15px;color:#ffffff;text-shadow:2px 2px 0 rgba(0,0,0,0.5);margin-bottom:22px;line-height:1.6;">{{ detailName }}</div>
    <div style="font-size:10px;color:#dfe6ff;opacity:0.85;margin-bottom:10px;">DATE&nbsp;&nbsp;{{ detailDate }}</div>
    <div style="font-size:10px;color:#dfe6ff;opacity:0.85;margin-bottom:30px;">SIZE&nbsp;&nbsp;{{ detailSize }}</div>

    <!-- Botão COPY: cor/fundo/sombra ficam "ativos" quando detailOption === 0 -->
    <div onClick="{{ onOptionCopy }}" style="font-size:11px;padding:10px 16px;margin-bottom:10px;border-radius:4px;cursor:pointer;color:{{ copyColor }};background:{{ copyBg }};box-shadow:{{ copyShadow }};">COPY</div>
    <!-- Botão DELETE: cor/fundo/sombra ficam "ativos" quando detailOption === 1 -->
    <div onClick="{{ onOptionDelete }}" style="font-size:11px;padding:10px 16px;border-radius:4px;cursor:pointer;color:{{ deleteColor }};background:{{ deleteBg }};box-shadow:{{ deleteShadow }};">DELETE</div>
  </div>

  <!-- ===== Legenda inferior (botões estilo PS2: X = Enter, Triângulo = Back) =====
       Clique aqui equivale a apertar Enter/X ou Esc/Backspace no teclado
       (mesma lógica de onKeyDown() no JS). -->
  <div style="position:absolute;z-index:2;bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:40px;color:#f0f0f0;font-size:11px;text-shadow:2px 2px 0 rgba(0,0,0,0.5);">
    <div onClick="{{ onEnter }}" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;color:#5aa7ff;font-weight:bold;font-size:14px;">✕</span>
      <span>Enter</span>
    </div>
    <div onClick="{{ onBack }}" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;color:#57d68d;font-weight:bold;font-size:13px;">△</span>
      <span>Back</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/javascript" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 960, &quot;height&quot;: 720}}">
// ================================================================
// DADOS ESTÁTICOS (mock). Para adicionar/remover itens do "memory card",
// edite TITLES, COLORS, SIZES e DATES juntos — todos são indexados por posição (i).
// Hoje existem 13 títulos mas a grade tem 15 slots (5x3); os 2 slots extras
// ficam sem ícone e sem clique útil (ver icons.length = 15 em setupThree()).
// ================================================================

// Nome de cada item, exibido em 2 linhas (linha 1 e linha 2) no cabeçalho e no detalhe.
const TITLES = [
  ["Projeto", "Zero Um"], ["Projeto", "Zero Dois"], ["Projeto", "Zero Três"], ["Projeto", "Zero Quatro"], ["Projeto", "Zero Cinco"],
  ["Projeto", "Zero Seis"], ["Projeto", "Zero Sete"], ["Projeto", "Zero Oito"], ["Projeto", "Zero Nove"], ["Projeto", "Zero Dez"],
  ["Projeto", "Zero Onze"], ["Projeto", "Zero Doze"], ["Projeto", "Zero Treze"], ["Projeto", "Zero Quatorze"], ["Projeto", "Zero Quinze"]
];

// Cor de cada ícone 3D (hex no formato 0xRRGGBB usado pelo Three.js). Mesma ordem de TITLES.
const COLORS = [0xff0000, 0xff4500, 0xff8c00, 0xcffa500, 0xffd700,
  0xffff00, 0xadff2f, 0x7fff00, 0x008000, 0x00ffff,
  0x00bfff, 0x0000ff, 0x4a235A, 0x4B0082, 0x8A2BE2];

// Tamanho "fake" de cada arquivo, só para exibição (fórmula arbitrária: 380 + i*53 KB).
const SIZES = TITLES.map((_, i) => (380 + i * 53) + ' KB');

// Data "fake" de cada arquivo, gerada a partir do índice (não é data real).
const DATES = TITLES.map((_, i) => {
  const day = String((i % 28) + 1).padStart(2, '0');
  const month = String(((i * 3) % 12) + 1).padStart(2, '0');
  return `2024/${month}/${day}`;
});

// Gradientes de fundo: GRID_BG na tela de seleção, DETAIL_BG na tela de detalhe.
// Trocar aqui muda a cor geral da UI (equivalente ao "tema").
const GRID_BG = 'radial-gradient(ellipse 130% 90% at 50% 12%, #9b9d9f 0%, #83858a 32%, #616266 68%, #47484b 100%)';
const DETAIL_BG = 'radial-gradient(ellipse 140% 100% at 22% 45%, #8f1620 0%, #4a0f18 40%, #142a52 74%, #0b1730 100%)';

// ================================================================
// Componente principal. "state" controla qual tela é mostrada:
//   mode: 'grid'   -> tela de seleção (grade de ícones)
//   mode: 'detail' -> tela de detalhe (COPY/DELETE) do item selecionado
//   selectedIndex  -> índice (0-14) do item em foco na grade
//   detailOption   -> 0 = COPY selecionado, 1 = DELETE selecionado
// ================================================================
class Component extends DCLogic {
  state = { selectedIndex: 0, mode: 'grid', detailOption: 0 };

  // Referências a elementos do DOM (preenchidas pelo framework via atributo ref="{{ }}" no HTML)
  canvasRef = React.createRef(); // o <canvas> onde o Three.js desenha
  gridRef = React.createRef();   // a <div> grid, usada só para medir a posição das células

  // Estado "interno" do Three.js (não é state do componente, não dispara re-render)
  icons = [];          // lista de { group, core, scaleCurrent, rotY } — um por slot da grade
  glowSprite = null;   // brilho/glow atrás do ícone selecionado
  raf = null;           // id do requestAnimationFrame, para poder cancelar no unmount
  gridPositions = [];   // posições 3D (mundo) correspondentes ao centro de cada célula da grade
  _lastGridKey = '';    // cache para saber se o layout da grade mudou (evita recalcular toda hora)
  _lastWinKey = '';     // cache do tamanho da janela, idem

  // Chamado quando o componente é montado na tela.
  // Liga os listeners de teclado/resize e começa a tentar inicializar o Three.js.
  componentDidMount() {
    window.addEventListener('keydown', this.onKeyDown);
    window.addEventListener('resize', this.onResize);
    this.waitForThree();
  }

  // Three.js é carregado via <script> externo (helmet); pode não estar pronto ainda.
  // Este método fica "espiando" a cada frame até THREE existir, então chama setupThree().
  waitForThree = () => {
    if (typeof THREE === 'undefined' || !THREE.WebGLRenderer) {
      requestAnimationFrame(this.waitForThree);
      return;
    }
    try {
      this.setupThree();
    } catch (err) {
      console.error('PS2 memory card: setupThree failed', err);
    }
  };

  // Limpeza ao desmontar: remove listeners, para o loop de animação e libera a GPU (WebGL).
  // Importante manter isso sempre que adicionar novos listeners/timers acima.
  componentWillUnmount() {
    window.removeEventListener('keydown', this.onKeyDown);
    window.removeEventListener('resize', this.onResize);
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.renderer) this.renderer.dispose();
  }

  // ===== Controles de teclado =====
  // Para mudar as teclas de atalho (ex: trocar X por Espaço), edite as comparações
  // de e.key abaixo. Para mudar o tamanho da grade, troque "cols"/"total" aqui
  // e também o grid-template-columns/rows no HTML (devem ficar em sincronia).
  onKeyDown = (e) => {
    const { mode, selectedIndex, detailOption } = this.state;
    if (mode === 'grid') {
      const cols = 5, total = 15;
      let idx = selectedIndex;
      if (e.key === 'ArrowRight') idx = (idx + 1) % total;
      else if (e.key === 'ArrowLeft') idx = (idx - 1 + total) % total;
      else if (e.key === 'ArrowDown') idx = (idx + cols) % total;
      else if (e.key === 'ArrowUp') idx = (idx - cols + total) % total;
      else if (e.key === 'Enter' || e.key === 'x' || e.key === 'X') {
        // X/Enter = "abrir" o item selecionado (equivalente ao botão Enter na legenda)
        e.preventDefault();
        this.confirmSelection();
        return;
      } else return; // qualquer outra tecla é ignorada na grade
      e.preventDefault();
      this.setState({ selectedIndex: idx });
    } else {
      // mode === 'detail'
      if (e.key === 'Escape' || e.key === 'Backspace') {
        // Esc/Backspace = voltar para a grade (equivalente ao botão Back)
        e.preventDefault();
        this.goBack();
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        // Cima/Baixo alterna entre COPY (0) e DELETE (1)
        e.preventDefault();
        this.setState({ detailOption: detailOption === 0 ? 1 : 0 });
      }
    }
  };

  // Redimensionamento da janela: só precisa reajustar o tamanho do canvas/câmera.
  onResize = () => {
    this.sizeCanvas();
  };

  // Abre o painel de detalhe do item atualmente selecionado.
  // Chamado por: tecla Enter/X, clicar 2x no mesmo slot, ou botão "Enter" da legenda.
  confirmSelection = () => {
    if (this.state.mode !== 'grid') return;
    this.setState({ mode: 'detail', detailOption: 0 });
  };

  // Fecha o painel de detalhe e volta para a grade.
  // Chamado por: tecla Esc/Backspace ou botão "Back" da legenda.
  goBack = () => {
    if (this.state.mode !== 'detail') return;
    this.setState({ mode: 'grid' });
  };

  // Clique num slot da grade: se já era o selecionado, abre o detalhe (como um duplo clique);
  // caso contrário, só move a seleção para ele.
  onSlotClick = (i) => {
    if (this.state.mode !== 'grid') return;
    if (this.state.selectedIndex === i) this.confirmSelection();
    else this.setState({ selectedIndex: i });
  };

  // Ajusta o tamanho do canvas/renderer/câmera para acompanhar a janela (chamado no
  // load inicial, em resize, e a cada tick() caso o tamanho da janela tenha mudado).
  sizeCanvas() {
    if (!this.renderer) return;
    const canvas = this.canvasRef.current;
    const w = window.innerWidth, h = window.innerHeight;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    this.renderer.setPixelRatio(window.devicePixelRatio || 1);
    this.renderer.setSize(w, h, false);
    if (this.camera) {
      this.camera.aspect = w / h;
      this.camera.updateProjectionMatrix();
    }
  }

  // Gera uma textura circular com gradiente radial (usada para a sombra sob o ícone
  // e para o glow atrás do item selecionado). "inner"/"outer" são cores CSS (rgba/hex).
  makeRadialTexture(inner, outer, size) {
    size = size || 128;
    const cnv = document.createElement('canvas');
    cnv.width = cnv.height = size;
    const ctx = cnv.getContext('2d');
    const grd = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grd.addColorStop(0, inner);
    grd.addColorStop(1, outer);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(cnv);
    tex.needsUpdate = true;
    return tex;
  }

  // Cria um ícone 3D: um icosaedro colorido (o "core") + um plano com textura de
  // sombra embaixo dele. Para trocar a forma do ícone (ex: esfera, cubo), troque
  // a geometria "IcosahedronGeometry" aqui. Para mudar o brilho/material, mexa em
  // MeshPhongMaterial (shininess/specular).
  makeIcon(color) {
    const group = new THREE.Group();
    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.62, 0),
      new THREE.MeshPhongMaterial({ color, shininess: 130, specular: 0xffffff })
    );
    group.add(core);

    const shadow = new THREE.Mesh(
      new THREE.PlaneGeometry(1.7, 1.7),
      new THREE.MeshBasicMaterial({ map: this.shadowTex, transparent: true, depthWrite: false })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = -0.66;
    group.add(shadow);

    return { group, core, scaleCurrent: 1, rotY: 0 };
  }

  // Converte uma coordenada de tela em pixels (px, py) para uma posição no mundo 3D,
  // na profundidade z=0 do plano da cena. É assim que os ícones (3D) conseguem ficar
  // alinhados exatamente embaixo das células invisíveis da grade (HTML/CSS).
  screenToWorld(px, py) {
    const camera = this.camera;
    const ndcX = (px / window.innerWidth) * 2 - 1;
    const ndcY = -(py / window.innerHeight) * 2 + 1;
    const vec = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera);
    const dir = vec.sub(camera.position).normalize();
    const dist = -camera.position.z / dir.z;
    return camera.position.clone().add(dir.multiplyScalar(dist));
  }

  // Recalcula, para cada célula da grade HTML, a posição 3D correspondente
  // (this.gridPositions) e a escala base dos ícones (this.baseScale, baseada na
  // largura real de uma célula). Chamado sempre que o layout da grade muda
  // (resize, primeira renderização etc.) — ver chamadas em tick() e setupThree().
  updateGridPositions() {
    if (!this.gridRef.current) return;
    const cells = this.gridRef.current.children;
    const positions = [];
    for (let i = 0; i < cells.length; i++) {
      const r = cells[i].getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height * 0.42; // leve deslocamento vertical p/ centralizar visualmente o ícone
      positions.push(this.screenToWorld(cx, cy));
    }
    this.gridPositions = positions;

    // Usa a largura da primeira célula para calibrar o tamanho "padrão" dos ícones,
    // assim eles acompanham o zoom/tamanho de tela automaticamente.
    const r0 = cells[0].getBoundingClientRect();
    const cy0 = r0.top + r0.height * 0.42;
    const leftW = this.screenToWorld(r0.left, cy0);
    const rightW = this.screenToWorld(r0.right, cy0);
    const worldWidth = leftW.distanceTo(rightW);
    this.baseScale = (worldWidth * 0.68) / 1.24; // 0.68 = fração da célula ocupada; 1.24 = diâmetro aprox. do icosaedro
  }

  // Inicializa a cena Three.js (renderer, câmera, luzes, texturas e os 15 ícones).
  // Só roda uma vez (guard "if (this.renderer) return"). Se quiser mudar iluminação,
  // ângulo de câmera ou quantidade de ícones, é aqui.
  setupThree() {
    if (this.renderer) return;
    const canvas = this.canvasRef.current;
    if (!canvas) return;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setClearColor(0x000000, 0);
    this.renderer = renderer;

    const scene = new THREE.Scene();
    this.scene = scene;

    const camera = new THREE.PerspectiveCamera(15, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.set(0, 0, 8);
    camera.lookAt(0, 0, 0);
    this.camera = camera;

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 1.35);
    key.position.set(0.6, 2.2, 2.4);
    scene.add(key);

    this.shadowTex = this.makeRadialTexture('rgba(0,0,0,0.55)', 'rgba(0,0,0,0)');
    const glowTex = this.makeRadialTexture('rgba(200,230,255,0.95)', 'rgba(200,230,255,0)');
    const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    glowSprite.scale.set(2.4, 2.4, 1);
    glowSprite.visible = false;
    scene.add(glowSprite);
    this.glowSprite = glowSprite;

    for (let i = 0; i < 15; i++) {
      const rec = this.makeIcon(COLORS[i % COLORS.length]);
      scene.add(rec.group);
      this.icons.push(rec);
    }

    this.sizeCanvas();

    const frame = () => {
      this.raf = requestAnimationFrame(frame);
      try {
        this.tick();
      } catch (err) {
        console.error('PS2 memory card render loop error:', err);
      }
    };

    // Espera a grade HTML ter largura real (layout pronto) antes de medir posições
    // e começar o loop de animação — evita medir uma grade ainda com display:none/0px.
    const waitForLayout = () => {
      if (this.gridRef.current && this.gridRef.current.getBoundingClientRect().width > 0) {
        this.updateGridPositions();
        frame();
      } else {
        requestAnimationFrame(waitForLayout);
      }
    };
    waitForLayout();
  }

  // Loop de animação (roda a cada frame via requestAnimationFrame).
  // Responsável por: reagir a resize/mudanças de layout, mover/escalar cada ícone
  // em direção ao seu alvo (posição na grade OU centro do painel de detalhe),
  // fazer o item selecionado girar e pulsar o glow, e finalmente renderizar a cena.
  tick() {
    const winKey = window.innerWidth + 'x' + window.innerHeight;
    if (winKey !== this._lastWinKey) {
      this._lastWinKey = winKey;
      this.sizeCanvas();
    }
    if (this.gridRef.current) {
      const r = this.gridRef.current.getBoundingClientRect();
      const key = r.left + ',' + r.top + ',' + r.width + ',' + r.height;
      if (key !== this._lastGridKey && r.width > 0) {
        this._lastGridKey = key;
        this.updateGridPositions();
      }
    }

    const { mode, selectedIndex } = this.state;
    const time = performance.now() / 1000;
    // No modo detalhe, o item selecionado precisa "voar" até a posição do painel
    // de detalhe (27% da largura, 52% da altura da tela) — os outros ícones somem (scale 0).
    const detailTarget = mode === 'detail'
      ? this.screenToWorld(window.innerWidth * 0.27, window.innerHeight * 0.52)
      : null;

    const base = this.baseScale || 1; // escala "normal" de um ícone, calculada em updateGridPositions()

    for (let i = 0; i < this.icons.length; i++) {
      const rec = this.icons[i];
      const isSelected = i === selectedIndex;
      // Alvo de posição: no grid, cada ícone vai para sua célula; no detalhe, só o
      // selecionado tem alvo (os demais mantêm a última posição, mas ficam invisíveis via scale).
      const target = mode === 'detail' ? (isSelected ? detailTarget : null) : this.gridPositions[i];
      if (target) rec.group.position.lerp(target, 0.18); // 0.18 = suavização do movimento (menor = mais lento)

      // Escala alvo: no detalhe o selecionado fica grande (2.3x) e os outros somem (0);
      // no grid o selecionado fica um pouco maior (1.2x) que os demais (1x).
      const targetScale = mode === 'detail' ? (isSelected ? base * 2.3 : 0) : (isSelected ? base * 1.2 : base);

      if (isSelected) {
        // Suaviza a transição de escala e mantém uma rotação contínua (efeito "vivo") só no item em foco.
        rec.scaleCurrent += (targetScale - rec.scaleCurrent) * 0.22;
        rec.rotY += 0.035; // velocidade de rotação do ícone selecionado
      } else {
        rec.scaleCurrent = targetScale; // demais ícones aplicam a escala direto, sem suavização
        rec.rotY = 0;
      }

      rec.group.visible = rec.scaleCurrent > 0.01; // esconde de vez ícones bem pequenos/escondidos
      rec.group.scale.setScalar(Math.max(rec.scaleCurrent, 0.0001)); // evita escala 0 exata (bug de render em alguns navegadores)
      rec.group.rotation.y = rec.rotY;
    }

    // Glow (brilho pulsante) atrás do ícone selecionado, só visível se ele estiver visível.
    const selRec = this.icons[selectedIndex];
    if (selRec && selRec.group.visible) {
      this.glowSprite.visible = true;
      this.glowSprite.position.copy(selRec.group.position);
      this.glowSprite.position.z += 0.35; // fica um pouco atrás do ícone
      const pulse = 1 + 0.18 * Math.sin(time * 4); // pulsação de tamanho (velocidade = 4)
      const glowBase = (mode === 'detail' ? 3.2 : 2.4) * base * 0.5; // glow maior na tela de detalhe
      this.glowSprite.scale.set(glowBase * pulse, glowBase * pulse, 1);
      this.glowSprite.material.opacity = 0.55 + 0.25 * Math.sin(time * 4); // pulsação de opacidade
    } else {
      this.glowSprite.visible = false;
    }

    this.renderer.render(this.scene, this.camera);
  }

  // Monta o objeto de dados/handlers que o template HTML consome via {{ }}.
  // Este é o "ViewModel": tudo que aparece no HTML (texto, cores, display:block/none,
  // callbacks de clique) é calculado aqui a partir do state atual.
  renderVals() {
    const { selectedIndex, mode, detailOption } = this.state;
    const isDetail = mode === 'detail';

    // Um slot clicável por título; o clique delega para onSlotClick(i).
    const slots = TITLES.map((_, i) => ({
      onSelect: () => this.onSlotClick(i)
    }));

    // Estilo dos botões COPY/DELETE quando ativo (selecionado) vs inativo.
    // Para mudar a cor de destaque do menu de detalhe, edite estas 3 constantes.
    const activeColor = '#ffffff';
    const activeBg = '#2f6fe0';
    const activeShadow = '0 0 10px rgba(60,120,255,0.7)';
    const idleColor = '#dfe6ff';
    const idleBg = 'rgba(255,255,255,0.06)';
    const idleShadow = 'none';

    return {
      slots,                                   // -> sc-for da grade (um clique por slot)
      canvasRef: this.canvasRef,                // -> ref do <canvas>
      gridRef: this.gridRef,                    // -> ref da <div> grid
      freeKB: '2,138',                          // -> "{{ freeKB }} KB Free" no cabeçalho (mock fixo; troque aqui se quiser dinâmico)
      selectedTitleLines: TITLES[selectedIndex],// -> linhas do título no canto superior direito
      titleDisplay: isDetail ? 'none' : 'block',// -> esconde o título quando entra no detalhe
      gridDisplay: isDetail ? 'none' : 'grid',  // -> esconde a grade quando entra no detalhe
      detailDisplay: isDetail ? 'block' : 'none', // -> mostra o painel de detalhe só no modo 'detail'
      detailName: TITLES[selectedIndex].join(' '), // -> nome completo no painel de detalhe
      detailDate: DATES[selectedIndex],         // -> campo DATE do painel de detalhe
      detailSize: SIZES[selectedIndex],         // -> campo SIZE do painel de detalhe
      bgStyle: isDetail ? DETAIL_BG : GRID_BG,  // -> gradiente de fundo conforme a tela atual
      // Estilo do botão COPY/DELETE: "ativo" segue detailOption (0=COPY, 1=DELETE)
      copyColor: detailOption === 0 ? activeColor : idleColor,
      copyBg: detailOption === 0 ? activeBg : idleBg,
      copyShadow: detailOption === 0 ? activeShadow : idleShadow,
      deleteColor: detailOption === 1 ? activeColor : idleColor,
      deleteBg: detailOption === 1 ? activeBg : idleBg,
      deleteShadow: detailOption === 1 ? activeShadow : idleShadow,
      // Handlers de clique usados nos onClick="{{ }}" do HTML.
      // NOTA: clicar em COPY/DELETE aqui só troca qual botão fica "ativo" — não
      // executa nenhuma ação real de copiar/apagar (é só a navegação visual do menu,
      // igual ao PS2 original). Se quiser implementar a ação de fato, é aqui que entra.
      onOptionCopy: () => this.setState({ detailOption: 0 }),
      onOptionDelete: () => this.setState({ detailOption: 1 }),
      onBack: () => this.goBack(),     // -> botão "Back" (△) da legenda inferior
      onEnter: () => this.confirmSelection() // -> botão "Enter" (✕) da legenda inferior
    };
  }
}

</script>
</body>
